  <text x="450" y="550" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Public Sector</text>
  <text x="700" y="550" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Azure Batch</text>
  <text x="950" y="550" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">MLOps</text>
  
  <!-- URL -->
  <text x="1050" y="580" font-family="Arial, sans-serif" font-size="20" fill="#d7af18" text-anchor="middle">alejandroquilez.dev</text>
