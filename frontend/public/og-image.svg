<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060608"/>
      <stop offset="50%" style="stop-color:#111009"/>
      <stop offset="100%" style="stop-color:#25200e"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d7af18"/>
      <stop offset="100%" style="stop-color:#27ddd2"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Logo AQ -->
  <rect x="60" y="50" width="80" height="80" rx="16" fill="url(#text-gradient)"/>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#060608" text-anchor="middle">AQ</text>
  
  <!-- Name -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="32" fill="#d7af18" text-anchor="middle" letter-spacing="3">ALEJANDRO QUILEZ ASENSIO</text>
  
  <!-- Headline -->
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#text-gradient)" text-anchor="middle">Data Architecture</text>
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="54" font-weight="bold" fill="url(#text-gradient)" text-anchor="middle">From Design to Operation</text>
  
  <!-- Subtitle -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="28" fill="#e2e8f0" text-anchor="middle">Azure · Geospatial Platforms · HPC</text>
  
  <!-- Stats -->
